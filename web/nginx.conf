server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path serves index.html so React Router
    # can resolve client-side routes like /standings, /games/:gamePk, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets — Vite emits content-hashed filenames into /assets/, so
    # they're safe to cache forever. New deploys ship new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker MUST stay fresh — never cache. If the SW caches, users
    # get stuck on a stale version because the SW controls its own update
    # check. Same goes for the registration shim.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # The manifest declares the install metadata — short-cycled so a tweak
    # to icons/colors propagates without waiting on browser cache TTLs.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # The HTML shell itself must stay fresh; everything else it loads is
    # content-hashed and immutable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compress text payloads. Vite already minifies, but gzip cuts another
    # 60-70% off the wire.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
